[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acquisition-probability-model"
version = "0.3.0"
description = "Leakage-aware takeover-target ranking model with temporal backtesting and top-decile lift analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Project Contributor" }]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "duckdb>=1.1,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
acq-model = "acq_probability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acq_probability"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
